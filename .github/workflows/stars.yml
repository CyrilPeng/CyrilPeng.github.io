name: Update star chart

on:
  schedule:
    # 每周一 02:00 UTC = 北京时间周一 10:00
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-chart
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate star chart
        # GITHUB_TOKEN 只对当前仓库有效，读不到 venera-next 的 API。
        # 这里读一个可选 secret：没配置就走匿名（每小时 60 次，21 次够用），
        # 以后想提高限额就加一个 PAT 存成 STAR_TOKEN。
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: python scripts/gen-stars.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stars.svg index.html en.html; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars.svg index.html en.html
          git commit -m "chore: 更新 VeneraNext 星标曲线"
          git push
