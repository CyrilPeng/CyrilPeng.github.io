name: Update star chart

on:
  schedule:
    # 每周一 02:00 UTC = 北京时间周一 10:00
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-chart
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate star chart
        # stargazers 接口强制要求认证，而 GITHUB_TOKEN 只对当前仓库有效，
        # 读不了 venera-next。所以这里只调公开的 repo 接口取总数，
        # 逐日/逐周累积到 data/stars.json，曲线由历史数据绘制。
        # 想提高历史精度可在本地带 token 跑一次（会做全量回填）。
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: python scripts/gen-stars.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stars.svg data/stars.json index.html en.html; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars.svg data/stars.json index.html en.html
          git commit -m "chore: 更新 VeneraNext 星标曲线"
          git push
